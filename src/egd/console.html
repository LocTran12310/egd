  const full = pageFeature(rid, slug), f = full || s;  // the header needs only the summary
  tab = FTABS.some(([k]) => k === tab) ? tab : "plan";
  const gateItem = r.inbox.find(i => i.kind === "gate" && i.slug === slug);
  const head = `<div class="page"><div class="fhead"><a class="chip" href="#/r/${encodeURIComponent(rid)}" title="${esc(t("Repository"))}">${esc(rid)}</a>${r.readonly ? `<span class="chip">${esc(t("{source} · read-only", { source: r.source || t("other") }))}</span>` : ""}<h2>${inlineMd(f.title)}</h2>${health(f.health)}
      <span class="muted">${esc(f.tier)} · ${esc(t("{n}% of estimate", { n: f.progress }))}${f.client ? " · " + esc(t("client {name}", { name: f.client })) : ""}</span>
      ${f.gate !== "closed" && f.gate !== "released" && r.source !== "ai-dlc" ? `<span style="margin-left:auto">${actBtn({ action: "close", label: "Close feature", needs: ["outcome", "closing"] }, { repo: rid, slug }, "sm")}</span>` : ""}</div>
    <div class="gates">${f.gates.map(g => `<span class="gate ${g.passed ? "done" : g.name === f.gate ? "next" : ""}" title="${g.passed ? esc(t("passed by {who}", { who: g.by }) + " · ") + when(g.at) : ""}">${g.passed ? "✓ " : ""}${esc(g.name)}</span>`).join("")}</div>
    ${f.gate === "closed" && f.closed ? `<div class="callout">${tHtml("Closed as {outcome} by {who}, {when}", { outcome: `<b>${esc(t(f.closed.outcome))}</b>`, who: esc(f.closed.by || ""), when: esc(when(f.closed.at)) })} — ${inlineMd(f.closed.reason || "")}${(f.closed.open_tasks || []).length ? `<div class="muted small">${esc(t("Left undone: {ids}", { ids: f.closed.open_tasks.join(", ") }))}</div>` : ""} ${actBtn({ action: "reopen_feature", label: "Reopen", needs: ["note"] }, { repo: rid, slug }, "sm")}</div>`
      : f.gate === "released" ? "" : r.source === "ai-dlc" ? `<div class="callout">${tHtml("Next: {gate}", { gate: `<b>${esc(f.gate)}</b>` })} · ${esc(trServer(f.next_problems[0] || ""))}</div>` : gateItem ? `<div class="callout ready">${tHtml("{gate} is open.", { gate: `<b>${esc(f.gate)}</b>` })} ${repoRO(rid) ? `<span class="muted">${esc(t("Pass it with"))} <span class="mono">egd pass ${esc(f.gate)}</span>.</span>` : actBtn(gateItem.actions[0], { repo: rid, slug })}</div>`
      : `<div class="callout">${tHtml("{gate} is closed:", { gate: `<b>${esc(f.gate)}</b>` })}<ul>${f.next_problems.map(p => `<li>${esc(trServer(p))}${p.startsWith("release.md: '## Rollback'") && !repoRO(rid) ? " " + actBtn({ action: "rollback", label: "Write rollback", needs: ["rollback"], primary: true }, { repo: rid, slug }, "sm") : ""}</li>`).join("")}</ul></div>`}
    <div class="tabs scroll-x" data-cue>${FTABS.map(([k, l]) => `<a class="${k === tab ? "on" : ""}"${k === tab ? ` aria-current="page"` : ""} href="#/r/${encodeURIComponent(rid)}/f/${encodeURIComponent(slug)}/${k}">${esc(t(l))}</a>`).join("")}</div>`;
  const body = { plan: fPlan, gates: fGates, evidence: fEvidence, scope: fScope, trail: fTrail }[tab];
  if (full) return head + body(full, rid) + "</div>";
  const err = FDETAIL[rid + "/" + slug]?.error;
  return head + (err ? `<div class="callout">${esc(t("Could not load this feature: {msg}", { msg: err }))}</div>`
    : `<p class="muted">${esc(t("Loading…"))}</p>`) + "</div>";
}

function fPlan(f, rid) {
  const sliceOf = id => f.slices.find(s => s.id === id);
  const cols = [...new Set(f.tasks.map(x => x.col))];
  const owners = [...new Set(f.tasks.map(x => x.owner).filter(Boolean))].sort();
  const tasks = UI.table(`ftasks:${rid}/${f.slug}`, { rows: f.tasks, placeholder: t("Find a task…"),
    search: x => [x.id, x.title, x.slice, sliceOf(x.slice)?.title, x.owner, x.col].join(" "),
    filters: [
      { key: "slice", label: t("Slice"), options: f.slices.map(s => ({ value: s.id, label: s.id + " · " + s.title })), match: (x, v) => x.slice === v },
      { key: "status", label: t("Status"), options: COLS.map(c => c[0]).concat("todo").filter(c => cols.includes(c)).map(c => ({ value: c, label: c === "todo" ? t("waiting") : t(c) })), match: (x, v) => x.col === v },
      { key: "owner", label: t("Owner"), options: owners.map(o => ({ value: o, label: "@" + o })), match: (x, v) => x.owner === v },
    ],
    columns: [
      { key: "id", label: t("Task"), cls: "mono", sortValue: x => x.id, render: x => esc(x.id) },
      { key: "title", label: t("Title"), cls: "wrap", sortValue: x => x.title,
        render: x => `${inlineMd(x.title)}${x.solo ? " " + st("warn", t("solo")) : ""}${x.rejects ? ` <span class="muted small">${esc(t("{n}× sent back", { n: x.rejects }))}</span>` : ""}` },
      { key: "slice", label: t("Slice"), cls: "mono muted", sortValue: x => x.slice, render: x => `<span title="${esc(sliceOf(x.slice)?.title || "")}">${esc(x.slice)}</span>` },
      { key: "status", label: t("Status"), sortValue: x => ["todo", "ready", "doing", "review", "blocked", "done"].indexOf(x.col),
        render: x => st(x.col, x.col === "todo" ? t("waiting") : undefined) },
      { key: "owner", label: t("Owner"), cls: "muted", sortValue: x => x.owner || "", render: x => x.owner ? "@" + esc(x.owner) : "" },
      { key: "est", label: t("Est."), num: true, cls: "small", sortValue: x => x.estimate, render: x => `${esc(x.estimate)}h${x.spent != null ? " / " + esc(x.spent) + "h" : ""}` },
      { key: "acts", label: "", cls: "ta-r", render: x => taskActions(x, rid, f.slug) },
    ], empty: esc(t("Not sliced yet.")) });
  const buildPassed = f.gates.every(g => g.name !== "build" || g.passed);  // UAT follows `build` when the tier has it
  const slices = f.slices.map(s => { const ts = f.tasks.filter(t => t.slice === s.id); const done = ts.filter(t => t.status === "done").length;
    const uatDue = buildPassed && done === ts.length && !s.uat?.passed;
    const key = `acc:${rid}/${f.slug}/${s.id}`;
    return `<details class="acc" ${store.get(key, false) ? "open" : ""} data-keep="${esc(key)}"><summary><span class="mono">${esc(s.id)}</span><span><b>${inlineMd(s.title)}</b> <span class="muted small">${esc(t("covers {list}", { list: s.covers.join(", ") }))}</span></span>
      <span class="small muted">${esc(t("{a}/{b} done", { a: done, b: ts.length }))}</span>${s.uat ? st(s.uat.passed ? "ok" : "bad", s.uat.passed ? t("UAT passed") : t("UAT failed")) : st("neutral", t("No UAT"))}
      ${uatDue ? actBtn({ action: "uat", target: s.id }, { repo: rid, slug: f.slug }, "sm") : ""}</summary>
      ${s.demo ? `<div class="demo"><div class="muted small">${esc(t("Demo script"))}</div>${demoHtml(s.demo)}</div>` : `<div class="demo muted small">${esc(t("No demo script."))}</div>`}</details>`; }).join("");
  return tasks + (slices ? `<h2>${esc(t("Slices"))}</h2><div class="panel">${slices}</div>` : "");
}

// The rules EGD enforces, per language (the guide and each feature's Gates tab). A snapshot carries
// them as P.core / P.core_vi; a live page fetches them once per language and draws again when they
// arrive. undefined while loading, null when they cannot be had.
const CORE = {};  // lang → { data, loading, failed }
function coreFor(lang) {
  if (P.core) return (lang === "vi" && P.core_vi) || P.core;
  if (!LIVE) return null;
  const c = (CORE[lang] ||= {});
  if (c.data) return c.data;
  if (!c.loading && !(c.failed && Date.now() - c.failed < 5000))
    c.loading = fetch("api/core?" + new URLSearchParams({ lang }), { cache: "no-cache" })
      .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
      .then(j => { c.data = j; c.failed = 0; }, () => { c.failed = Date.now(); })
      .finally(() => { c.loading = null; if (getLang() === lang) requestRender(); });
  return c.loading ? undefined : null;
}

// One card per gate, in EGD order: what it proves, its rules for this tier, and its check run now.
function fGates(f, rid) {
  const r = P.repos.find(x => x.id === rid);
  const C0 = coreFor(getLang()), C = C0 || null;
  // the rules in words arrive from api/core: say so while they load, and offer a retry if they could not
  const rulesNote = C0 === undefined ? `<p class="muted small" aria-busy="true">${esc(t("Loading the rules…"))}</p>`
    : !C0 && LIVE ? `<div class="callout">${esc(t("Could not load the rules."))} <button type="button" class="btn sm" data-retry>${esc(t("Try again"))}</button></div>` : "";
  const checks = f.gate_checks;
  const passedLine = g => g.passed ? `${st("ok", t("passed"))}${g.by || g.at ? ` <span class="muted small">${esc(t("by {who}", { who: g.by || "—" }))}${g.at ? ` · <span title="${when(g.at)}">${esc(ago(g.at))}</span>` : ""}</span>` : ""}` : "";
  const pill = (g, inTier) => !inTier ? `<span class="chip">${esc(t("not in {tier}", { tier: f.tier }))}</span>`
    : g.passed ? passedLine(g) : g.name === f.gate ? st("info", t("next")) : st("neutral", t("later"));
  if (!checks) {  // read-only import from another tool: it has its own gates and runs its own checks
    return `<p class="muted small">${esc(t("These gates belong to the other tool — its checks run there, not in EGD."))}</p>
      <div class="fgates">${f.gates.map((g, i) => `<section class="panel fgate ${g.passed ? "done" : g.name === f.gate ? "next" : ""}">
        <div class="fgh"><span class="gi">${i + 1}</span><b>${esc(g.name)}</b>${pill(g, true)}</div>
        ${g.passed ? "" : `<div class="muted small">${esc(t("Checks run in the other tool."))}</div>`}</section>`).join("")}</div>`;
  }
  const mine = Object.fromEntries(f.gates.map(g => [g.name, g]));
  const order = C ? C.gates.map(g => g.name) : f.gates.map(g => g.name);
  const info = Object.fromEntries((C ? C.gates : []).map(g => [g.name, g]));
  const gateItem = r && r.inbox.find(i => i.kind === "gate" && i.slug === f.slug);
  return `<p class="lead">${esc(t("Every gate of this feature, checked now — independently of order. A passed gate stays passed in the trail; the check shows whether its rules still hold."))}</p>
    ${rulesNote}<div class="fgates">${order.map((name, i) => {
      const g = mine[name], inTier = !!g, gi = info[name] || {};
      const problems = inTier ? (checks[name] || []) : [];
      const isNext = inTier && name === f.gate;
      const rules = (gi.rules || []).filter(x => x.tiers.includes(f.tier));
      let check = "";
      if (inTier) {
        if (!problems.length) {
          check = `<div class="gcheck ok">✓ ${esc(t("All rules hold now"))}</div>`;
          if (isNext) check += repoRO(rid) ? `<div class="muted small">${esc(t("Pass it with"))} <span class="mono">egd pass ${esc(name)}</span></div>`
            : gateItem ? `<div class="acts start">${actBtn(gateItem.actions[0], { repo: rid, slug: f.slug })}</div>` : "";
        } else {
          check = `${g.passed ? `<div class="gwarn">⚠ ${esc(t("Passed, but no longer holds now — something changed after it passed (for example the scope)."))}</div>` : ""}
            <div class="gcheck ${g.passed || isNext ? "bad" : "wait"}">${esc(isNext ? t("Closed because:") : g.passed ? t("Fails now:") : t("Not yet:"))}
              <ul>${problems.map(p => `<li>${esc(trServer(p))}</li>`).join("")}</ul></div>`;
        }
      }
      return `<section class="panel fgate ${!inTier ? "skipped" : g.passed ? (problems.length ? "drift" : "done") : isNext ? "next" : ""}">
        <div class="fgh"><span class="gi">${i + 1}</span><b>${esc(name)}</b>${pill(g || { name }, inTier)}
          ${gi.signs && inTier ? `<span class="fgs muted small">${esc(t("Signed by"))} ${gi.signs.map(x => `<span class="chip">${esc(x)}</span>`).join(" ")}</span>` : ""}</div>
        ${gi.proves ? `<div class="gp">${esc(gi.proves)}</div>` : ""}
        ${inTier ? `<div class="fgb"><div><div class="fgk">${esc(t("Rules"))}</div>
            ${rules.length ? `<ul class="rules">${rules.map(x => `<li>• ${inlineMd(x.text)}</li>`).join("")}</ul>` : `<div class="muted small">—</div>`}
            ${gi.records ? `<div class="grec">${esc(gi.records)}</div>` : ""}</div>
          <div><div class="fgk">${esc(t("Current check"))}</div>${check}</div></div>`
        : `<div class="muted small">${esc(t("Skipped in the {tier} tier.", { tier: f.tier }))}</div>`}
      </section>`;
    }).join("")}</div>`;
}

const fileUrl = (rid, slug, rel) => `files/${encodeURIComponent(rid)}/${encodeURIComponent(slug)}/${rel.split("/").map(encodeURIComponent).join("/")}`;
function fEvidence(f, rid) {
  const evs = [...new Set(f.acs.map(a => a.evidence))].sort();
  return `${UI.table(`facs:${rid}/${f.slug}`, { rows: f.acs, placeholder: t("Find a criterion…"),
    search: a => [a.id, a.title, a.given, a.when, a.then, ...(a.levels || [])].join(" "),
    filters: [{ key: "evidence", label: t("Evidence"), options: evs.map(v => ({ value: v, label: v })), match: (a, v) => a.evidence === v }],
    columns: [
      { key: "id", label: t("AC"), cls: "mono", sortValue: a => a.id, render: a => esc(a.id) },
      { key: "then", label: t("Then"), cls: "wrap", sortValue: a => a.then, render: a => `${a.title ? `<div class="ac-title">${inlineMd(a.title)}</div>` : ""}${inlineMd(a.then)}<div class="muted small">${esc(t("given {given} · when {when}", { given: "\u0001", when: "\u0002" })).replace("\u0001", () => inlineMd(a.given)).replace("\u0002", () => inlineMd(a.when))}</div>` },
      { key: "levels", label: t("Levels"), cls: "muted", sortValue: a => (a.levels || []).join(", "), render: a => (a.levels || []).map(esc).join(", ") },
      { key: "evidence", label: t("Evidence"), sortValue: a => a.evidence, render: a => st(a.evidence) },
    ], empty: esc(t("No acceptance criteria.")) })}<h2>${esc(t("Proofs"))}</h2>
    <div class="panel tablewrap"><table><thead><tr>${[t("Proof"), t("Kind"), t("Env"), t("Status"), t("When"), t("Commit")].map(h => `<th>${esc(h)}</th>`).join("")}<th></th></tr></thead><tbody>
    ${f.proofs.flatMap(p => p.runs.map(run => `<tr><td><span class="mono">${esc(p.id)}</span> ${esc(p.title)}</td><td class="muted">${esc(p.kind)}</td>
      <td>${esc(run.env)}${run.required ? "" : ` <span class="muted small">${esc(t("optional"))}</span>`}</td><td>${st(run.stale ? "stale" : run.status)} <span class="muted small">${esc(run.reason || "")}</span></td>
      <td class="muted">${ago(run.at)}</td><td class="mono muted">${esc(run.sha || "")}</td>
      <td>${run.transcript && P.evidence !== false ? `<button class="btn ghost sm" data-transcript="${esc(run.transcript)}" data-repo="${esc(rid)}" data-slug="${esc(f.slug)}" data-focus="${esc("tr:" + run.transcript)}" aria-label="${esc(t("transcript") + " " + p.id + " · " + run.env)}">${esc(t("transcript"))}</button>` : ""}</td></tr>
      ${(run.shots || []).length && P.evidence !== false ? `<tr><td colspan="7" class="p-0"><div class="shots">${run.shots.map(s => { const u = esc(fileUrl(rid, f.slug, s)), name = s.split("/").pop();
        return `<button type="button" data-full="${u}" data-focus="${esc("shot:" + s)}" data-name="${esc(name)}" title="${esc(name)}" aria-label="${esc(t("Screenshot") + " " + name)}" style="padding:0;border:0;background:none;display:block;width:100%;cursor:zoom-in"><img loading="lazy" src="${u}" alt="${esc(name)}"></button>`; }).join("")}</div></td></tr>` : ""}`)).join("")
      || `<tr><td colspan="7" class="empty">${esc(t("No proofs declared."))}</td></tr>`}</tbody></table></div>`;
}

function fScope(f, rid) {
  const ctx = { repo: rid, slug: f.slug };
  const tbl = (head, rows, empty) => `<div class="panel tablewrap"><table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("") || `<tr><td colspan="${head.length}" class="empty">${esc(empty)}</td></tr>`}</tbody></table></div>`;
  return `<h2>${esc(t("Change requests"))}</h2>${tbl([t("CR"), t("Change"), t("Hours"), t("Status"), ""], f.crs.map(c => `<tr><td class="mono">${esc(c.id)}</td><td class="wrap">${inlineMd(c.title)}<div class="muted small">${inlineMd(c.reason)}</div></td><td class="num">${esc(c.hours)}</td><td>${st(c.status)}</td>
      <td class="ta-r">${c.status === "pending" ? actBtn({ action: "cr_approve", label: "Approve", target: c.id, primary: true }, ctx, "sm") + " " + actBtn({ action: "cr_reject", label: "Reject", target: c.id, needs: ["note"] }, ctx, "sm") : ""}</td></tr>`), t("No change requests."))}
    <h2>${esc(t("Assumptions"))}</h2>${tbl([t("Id"), t("Assumption"), t("Blocking"), t("Status"), t("Resolution"), ""], f.assumptions.map(a => `<tr><td class="mono">${esc(a.id)}</td><td class="wrap">${inlineMd(a.text)}</td><td>${a.blocking ? st("warn", t("blocking")) : ""}</td><td>${st(a.status || "open")}</td><td class="wrap muted small">${inlineMd(a.resolution || "")}</td>
      <td class="ta-r">${(a.status || "open") === "open" ? actBtn({ action: "resolve", label: "Confirm", target: a.id, needs: ["resolution"], primary: true }, ctx, "sm") + " " + actBtn({ action: "reject_assumption", label: "Reject", target: a.id, needs: ["resolution"] }, ctx, "sm") : ""}</td></tr>`), t("No assumptions."))}
    <h2>${esc(t("Defects"))}</h2>${tbl([t("Id"), t("Defect"), t("Severity"), t("Found in"), t("Status")], f.defects.map(d => `<tr><td class="mono">${esc(d.id)}</td><td class="wrap">${inlineMd(d.title)}</td><td>${st(d.severity)}</td><td class="muted">${esc(d.found_in)}</td><td>${st(d.status)}</td></tr>`), t("No defects."))}
    <h2>${esc(t("Decisions"))}</h2>${tbl([t("Id"), t("Decision"), t("Status"), t("Choice")], f.decisions.map(d => `<tr><td class="mono">${esc(d.id)}</td><td class="wrap">${inlineMd(d.title)}</td><td>${st(d.status || "proposed")}</td><td class="wrap muted">${inlineMd(d.choice || "")}</td></tr>`), t("No decisions."))}
    <h2>${esc(t("Metrics"))}</h2><div class="panel metrics">
      ${[[t("Actual ÷ estimate"), f.metrics.estimate_ratio != null ? f.metrics.estimate_ratio + "×" : "—"], [t("Review wait"), f.metrics.review_wait_avg_h != null ? f.metrics.review_wait_avg_h + "h" : "—"],
        [t("Rework"), f.metrics.rejections], [t("Solo"), f.metrics.solo_bypasses], [t("Scope growth"), f.metrics.scope_growth_pct + "%"], [t("Defect leakage"), f.metrics.leakage_pct + "%"]]
        .map(([l, v]) => `<div class="metric"><div class="muted small">${esc(l)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>`;
}

function fTrail(f, rid) {
  const ev = f.trail.slice().reverse();
  const types = [...new Set(ev.map(e => e.type))].sort();
  return UI.table(`ftrail:${rid}/${f.slug}`, { rows: ev, placeholder: t("Find an event…"),
    search: e => [e.by, evLabel(e.type), e.type, e.target, e.note].join(" "),
    filters: [whoFilter(ev), { key: "type", label: t("Event"), options: types.map(x => ({ value: x, label: evLabel(x) })).sort((a, b) => a.label.localeCompare(b.label)), match: (e, v) => e.type === v }],
    columns: [
      { key: "at", label: t("When"), cls: "muted", sortValue: e => e.at, render: e => `<span title="${when(e.at)}">${ago(e.at)}</span>` },
      { key: "by", label: t("Who"), sortValue: e => e.by, render: e => `<b>${esc(e.by)}</b>` },
      { key: "type", label: t("Event"), sortValue: e => evLabel(e.type), render: e => `<span title="${esc(e.type)}">${esc(evLabel(e.type))}</span>` },
      { key: "target", label: t("Target"), cls: "mono", sortValue: e => e.target, render: e => esc(e.target) },
      { key: "note", label: t("Note"), cls: "muted wrap note", render: e => inlineMd(e.note) },
    ], empty: esc(t("No events yet.")) });
}

// ---------------------------------------------------------------- transcripts
async function openTranscript(rid, slug, rel) {
  const url = fileUrl(rid, slug, rel), base = url.split("/").slice(0, -1).join("/");
  const still = loadingDialog(true);
  let html;
  try { const r = await fetch(url); if (!r.ok) throw new Error(httpError(r));
    html = `<h3 class="sr">${esc(t("Transcript"))}</h3><div class="foot mt-0"><button class="btn" data-close>${esc(t("Close"))}</button></div><div class="md">${renderMarkdown(await r.text(), base)}</div>`;
  } catch (e) { html = `<p>${esc(t("Transcript not available ({msg}).", { msg: e.message }))}</p><div class="foot"><button class="btn" data-close>${esc(t("Close"))}</button></div>`; }
  if (still()) openDialog(html, true);  // not over a dialog opened while it loaded
}

// ---------------------------------------------------------------- palette
function palette() {
  const items = [
    ...P.repos.map(r => ({ kind: t("repo"), label: r.id, sub: r.path, href: "#/r/" + encodeURIComponent(r.id) })),
    ...allFeatures().map(f => ({ kind: t("feature"), label: f.title, sub: f.repo + " · " + f.slug, href: `#/r/${encodeURIComponent(f.repo)}/f/${encodeURIComponent(f.slug)}` })),
    ...allTasks().map(x => ({ kind: x.id, label: x.title, sub: x.f.repo + " · " + x.f.title + " · " + t(x.col),
      href: `#/r/${encodeURIComponent(x.f.repo)}/f/${encodeURIComponent(x.f.slug)}/plan`,
      pre: () => UI.tableSet(`ftasks:${x.f.repo}/${x.f.slug}`, { q: x.id }, true) })),
  ];
  // a combobox: focus stays in the field, aria-activedescendant names the highlighted result, and a
  // polite status line says how many there are
  const name = t("Search repositories, features, tasks…");
  openDialog(`<div class="palette"><input class="input" id="pq" role="combobox" aria-expanded="true" aria-controls="pres" aria-autocomplete="list"
      placeholder="${esc(name)}" aria-label="${esc(name)}" autocomplete="off">
    <div class="res" id="pres" role="listbox" aria-label="${esc(t("Results"))}"></div><div class="sr" id="pcount" role="status" aria-live="polite"></div></div>`);
  let sel = 0, hits = [], said = null, sayTimer = null;
  const pick = () => {
    $("#pres").querySelectorAll('[role="option"]').forEach((o, i) => { o.classList.toggle("sel", i === sel); o.setAttribute("aria-selected", String(i === sel)); });
    const o = document.getElementById("popt-" + sel);
    if (o) { $("#pq").setAttribute("aria-activedescendant", o.id); o.scrollIntoView({ block: "nearest" }); } else $("#pq").removeAttribute("aria-activedescendant");
  };

  const manual = $("#manualadd");
  manual.onclick = async () => {
    const path = $("#manualpath").value;
    manual.disabled = true;
    const res = await repoOp("add", path);
    manual.disabled = false; refocus(manual);
    if (res === "setup") return setupPanel(path, d.path);
    if (res) folderPicker(d.path);
  };
  const scanBtn = $("#scanhere");
  if (scanBtn) scanBtn.onclick = async () => {
    scanBtn.disabled = true; scanBtn.textContent = t("Searching…");
    try {
      const s = await getJSON("api/browse/scan?path=" + encodeURIComponent(d.path));
      $("#scanres").innerHTML = `<h2>${esc(t("Found under this folder · {n}", { n: s.repos.length }))}</h2><div class="panel found">${s.repos.map(r => `
        <div class="row"><div class="minw0"><b>${esc(r.name)}</b> ${kindPill(r.kind)}<div class="h">${esc(r.path)}</div></div>
        <div class="acts">${r.registered ? st("ok", t("added")) : `<button class="btn sm primary" data-addfound="${esc(r.path)}" aria-label="${esc(t("Add") + " " + r.name)}">${esc(t("Add"))}</button>`}</div></div>`).join("")
        || `<div class="empty">${esc(t("No EGD or ai-dlc repositories within 3 levels."))}</div>`}</div>`;
      $("#scanres").querySelectorAll("[data-addfound]").forEach(b => b.onclick = async () => {
        b.disabled = true;
        if (await repoOp("add", b.dataset.addfound)) b.outerHTML = st("ok", t("added")); else b.disabled = false; });
    } catch (e) { toast(e.message, true); }
    scanBtn.disabled = false; scanBtn.textContent = t("Find repositories here"); refocus(scanBtn);
  };
}

const SETUP_FILES = [
  [".egd/config.toml", N_("limits, test command, roles, environments")],
  [".egd/team.toml", N_("who is on the team and what each may sign")],
  [".egd/map.md", N_("repository map — a person reads it and signs it")],
  [".egd/.gitignore", N_("keeps secrets, sessions and generated output out of git")],
  [".egd/secrets.env", N_("local values for proofs — gitignored, never committed")],
  [".egd/features/", N_("where plans and their trails will live")],
];
function setupPanel(path, back) {
  const name = path.split("/").filter(Boolean).pop();
  const box = $("#setuppanel");
  box.innerHTML = `<div class="confirm" role="group" tabindex="-1" aria-label="${esc(t("Set up EGD in {name}", { name }))}">
      <div class="ch"><b>${esc(t("Set up EGD in {name}", { name }))}</b><span class="mono small muted">${esc(path)}</span></div>
      <ul class="files">${SETUP_FILES.map(([f, why]) => `<li><span class="mono">${esc(f)}</span><span class="muted">${esc(t(why))}</span></li>`).join("")}</ul>
      <div class="note">${tHtml("Files that already exist are left as they are. Nothing is committed — review {dir} and commit it yourself.", { dir: `<span class="mono">.egd/</span>` })}</div>
      <div class="cf"><button class="btn" id="setupcancel">${esc(t("Cancel"))}</button><button class="btn primary" id="setupgo">${esc(t("Set up EGD"))}</button></div>
    </div>`;
  box.scrollIntoView({ block: "nearest" });
  box.firstElementChild.focus();   // the group, which states what will happen — not its committing button
  $("#setupcancel").onclick = () => { box.innerHTML = ""; };
  $("#setupgo").onclick = async () => {
    const go = $("#setupgo"); go.disabled = true; go.textContent = t("Setting up…"); $("#setupcancel").disabled = true;
    let res;
    try { res = await post("api/repos", { op: "setup", path }); }
    catch (e) {
      toast(netErr(e), true);
      if (go.isConnected) { go.disabled = false; go.textContent = t("Set up EGD"); $("#setupcancel").disabled = false; }
      return;
    }
    const { r, j } = res;
    if (!r.ok) {
      box.innerHTML = `<div class="confirm fail"><div class="ch"><b>${esc(t("Could not set up EGD in {name}", { name }))}</b></div>
        <div class="note mt-6">${esc(j.error || t("Unknown error"))}</div>
        <div class="cf"><button class="btn" id="setupcancel">${esc(t("Close"))}</button></div></div>`;
      $("#setupcancel").onclick = () => { box.innerHTML = ""; };
      return;
    }
    await afterChange();
    await folderPicker(back);
    $("#setuppanel").innerHTML = `<div class="confirm done"><div class="ch"><b>${esc(t("EGD is set up in {name}", { name }))}</b>${st("ok", t("added to the console"))}</div>
      <ol><li>${tHtml("Describe the repository in {map} — the {scout} agent can draft it — then sign it on the repository's Map tab.", { map: `<span class="mono">.egd/map.md</span>`, scout: `<span class="mono">egd-scout</span>` })}</li>
        <li>${tHtml("List the team and their roles in {team}.", { team: `<span class="mono">.egd/team.toml</span>` })}</li>
        <li>${esc(t("Start a feature:"))} <span class="mono">egd new &lt;name&gt; --by ${esc(P.user || "<you>")}</span></li></ol>
      <div class="cf"><button class="btn" id="setupcancel">${esc(t("Dismiss"))}</button><a class="btn primary" href="#/inbox" data-close>${esc(t("Go to inbox"))}</a></div></div>`;
    $("#setupcancel").onclick = () => { $("#setuppanel").innerHTML = ""; };
    const done = $("#setuppanel .confirm"); if (done) { done.setAttribute("role", "status"); done.tabIndex = -1; done.focus(); }
  };
}

async function repoOp(op, path) {
  if (!path || !path.trim()) { toast(t("Enter a path"), true); return false; }
  let res;
  try { res = await post("api/repos", { op, path }); } catch (e) { toast(netErr(e), true); return false; }
  const { r, j } = res;
  if (!r.ok && op === "add" && j.setup_possible) return "setup";
  if (!r.ok) { toast(trServer(j.error), true); return false; }
  toast(op === "add" ? t("Repository added") : t("Repository removed")); await afterChange(); return true;
}

initTheme($("#theme"));
UI.rerender = render;
async function refresh() { retryFailed(); if (await load()) render(); else if (P) statusbar(); else render(); }
$("#refresh")?.addEventListener("click", refresh);
window.addEventListener("hashchange", () => { $("#main").scrollTop = 0; render(); });
// crossing the phone widths swaps the search button and the status line
matchMedia("(max-width: 860px)").addEventListener?.("change", () => P && requestRender());
matchMedia("(max-width: 640px)").addEventListener?.("change", () => P && statusbar());
window.addEventListener("resize", () => document.querySelectorAll("[data-cue-on]").forEach(scrollCue));
// Polls every 10 s while the page is visible, and at once when it becomes visible again. The page
// keeps focus and caret across a redraw (UI.swap), so typing does not pause it; an open dialog or
// menu does — the redraw waits for it (requestRender), while the status line stays current.
let pollTimer = null, polling = false;
async function tick() {
  clearTimeout(pollTimer);
  if (polling) return;
  polling = true;
  try {
    if (!document.hidden) {
      const prev = P, ok = await load();
      if (ok && P !== prev) requestRender();
      else if (P) statusbar();
    }
  } finally { polling = false; pollTimer = setTimeout(tick, P ? 10000 : 3000); }
}
(async () => {
  await Promise.all([load(), needLang(getLang())]); render();
  if (!LIVE) return;
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  pollTimer = setTimeout(tick, P ? 10000 : 3000);
})();
</script>
</body>
