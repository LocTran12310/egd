<div class="shell">

<script>
/*EGD_UI_JS*/
</script>
<script>
const BOOT = /*EGD_BOOT*/null || { csrf: "", readonly: true, mode: "dashboard" };
const EMBEDDED = /*EGD_DATA*/null;      // a snapshot (egd site, egd board --html) carries its data inline
const LIVE = EMBEDDED === null;
const DASH = BOOT.mode === "dashboard"; // one repository, read-only: egd serve / site / board
let P = EMBEDDED, lastOk = EMBEDDED ? Date.parse(EMBEDDED.generated) || Date.now() : 0;
if (DASH) {
  document.querySelectorAll("[data-console]").forEach(el => el.remove());
  $("#brandsub").dataset.i18n = N_("Dashboard");
  $("#scope").remove(); $("#me").remove();
  if (!LIVE) $("#refresh").remove();
}
// a title with inline markdown, as link text: no link inside the link
const mdText = s => inlineMd(s).replace(/<a [^>]*>([\s\S]*?)<\/a>/g, "$1");
const fhref = (repo, slug) => `#/r/${encodeURIComponent(repo)}/f/${encodeURIComponent(slug)}`;
const flink = (repo, slug, text) => `<a class="${text == null || text === slug ? "slug" : "flink"}" href="${fhref(repo, slug)}" data-focus="${esc("fl:" + repo + "/" + slug)}">${text == null || text === slug ? esc(slug) : mdText(text)}</a>`;
const MAC = /mac|iphone|ipad/i.test(navigator.userAgentData?.platform || navigator.platform || "");
const KEY_K = MAC ? "⌘K" : "Ctrl K";
const small = w => matchMedia(`(max-width: ${w}px)`).matches;
const netErr = e => t("Network error — {msg}", { msg: e.message });
const httpError = (r, j) => (j && j.error) || t("Server error ({status})", { status: r.status });
// Every redraw that does not come from the person's own click (a load that finished, a poll) asks
// here: while a dialog or menu is open it waits, and runs once when they close — a redraw under a
// dialog would detach the control focus returns to.
let renderOwed = false;
function requestRender() {
  if (UI.busy()) { renderOwed = true; statusbar(); return; }
  renderOwed = false; render();
}
UI.onIdle = () => { if (renderOwed) requestRender(); };

// ---------------------------------------------------------------- data
// The lists are built once per portfolio and scope: every view of one render shares them.
// The stored scope is read once, then remembered until store.set("scope", …) changes it.
let MEMO = {}, SCOPE_NOW;
{ const set = store.set; store.set = (k, v) => { if (k === "scope") SCOPE_NOW = undefined; set.call(store, k, v); }; }
function memo() {
  if (SCOPE_NOW === undefined) SCOPE_NOW = DASH ? "" : store.get("scope", "");
  let s = SCOPE_NOW;
  if (s && !P.repos.some(r => r.id === s)) s = "";   // a stored scope whose repository is gone shows everything
  if (MEMO.p !== P || MEMO.s !== s) {
    const repos = P.repos.filter(r => !s || r.id === s);
    const features = repos.flatMap(r => r.features.map(f => ({ ...f, repo: r.id })));
    // planned in another tool (ai-dlc): read-only by nature. A dashboard's own EGD repository is read-only too, but its inbox is the point.
    const ro = new Set(P.repos.filter(r => r.readonly && (r.source || "egd") !== "egd").map(r => r.id));
    // a closed feature (dropped, research, superseded) has no work left: off the board, Pickable and People
    const inbox = repos.flatMap(r => r.inbox), tasks = features.filter(f => f.gate !== "closed").flatMap(f => f.tasks.map(x => ({ ...x, f })));
    // what a closed feature left undone: only the board's Closed column shows it
    const closedTasks = features.filter(f => f.gate === "closed").flatMap(f => f.tasks.filter(x => x.col !== "done").map(x => ({ ...x, col: "closed", f })));
    const ready = tasks.filter(x => x.col === "ready");
    MEMO = { p: P, s, repos, features, tasks, closedTasks,
      actionable: inbox.filter(i => !ro.has(i.repo)), elsewhere: inbox.filter(i => ro.has(i.repo)),
      pickable: ready.filter(x => !ro.has(x.f.repo)), pickAway: ready.filter(x => ro.has(x.f.repo)).length };
  }
  return MEMO;
}
const scopeId = () => memo().s;
const allFeatures = () => memo().features;
const allTasks = () => memo().tasks;

// "no-cache": the browser revalidates with If-None-Match; on a 304 it hands back its cached 200 —
// same body, same ETag — so an unchanged ETag keeps the same P object and the poll has nothing to redraw.
// Loads can overlap (a poll and an action's reload): each is numbered, and a response older than the
// one already applied is dropped, so the portfolio never goes back in time.
let etag = null, loadSeq = 0, loadApplied = 0;
async function load() {
  if (!LIVE) return true;
  const seq = ++loadSeq;
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), P ? 15000 : 6000);
  try {
    const r = await fetch("api/portfolio", { cache: "no-cache", signal: ctl.signal });
    if (!r.ok) throw new Error(r.status);
    if (seq < loadApplied) return true;   // a newer answer is already here
    const tag = r.headers.get("ETag");
    if (!P || !tag || tag !== etag) {
      const next = await r.json();
      if (seq < loadApplied) return true;
      const first = !P;
      P = next; etag = tag;
      clearRepoDetail();  // a new portfolio may mean new settings, a signed map, another team
      if (first) pruneStore();
    }
    loadApplied = seq; lastOk = Date.now(); return true;
  } catch (e) { return false; } finally { clearTimeout(timer); }
}
// After an action: what the repository page read is stale, and the portfolio has moved.
async function afterChange() { clearRepoDetail(); await load(); requestRender(); }

// Per-table and per-section view state is kept in localStorage. Drop what belongs to features
// and repositories that are gone, table states that are back to the defaults, and — past a few
// hundred entries — the ones used longest ago (each carries when it was last set: a table state
// its `t`, an open section the time it was opened; older entries count as oldest).
function pruneStore() {
  try {
    const repos = new Map(P.repos.map(r => [r.id, r])), keys = [], kept = [];
    for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    const featureGone = (rid, slug) => { const r = repos.get(rid); return !r || (!r.error && !r.features.some(f => f.slug === slug)); };
    for (const k of keys) {
      if (!k || !k.startsWith("egd:")) continue;
      const x = k.slice(4); let m, drop = false;
      if ((m = /^tbl:(?:ftasks|facs|ftrail):([^/]+)\/(.+)$/.exec(x)) || (m = /^acc:([^/]+)\/([^/]+)\//.exec(x))) drop = featureGone(m[1], m[2]);
      else if ((m = /^tbl:rfeat:(.+)$/.exec(x)) || (m = /^raw:([^/]+)\//.exec(x))) drop = !repos.has(m[1]);
      else if (/^acc:/.test(x)) drop = true;   // the old key format, which cannot be traced to a feature
      else if (x === "boardMore") drop = true; // no longer stored: "show more" lasts for the visit
      const v = store.get(x, null);
      if (!drop && x.startsWith("tbl:")) {
        const s = v || {};
        drop = !s.q && !Object.values(s.f || {}).some(v => v !== "" && v != null) && !s.d && (s.p || 1) === 1 && (s.n || 25) === 25;
      }
      if (drop) localStorage.removeItem(k);
      else if (/^(tbl|acc|raw):/.test(x)) kept.push([k, typeof v === "number" ? v : +(v && v.t) || 0]);
    }
    kept.sort((a, b) => b[1] - a[1]).slice(400).forEach(([k]) => localStorage.removeItem(k));
  } catch (e) {}
}
const storeDel = k => { try { localStorage.removeItem("egd:" + k); } catch (e) {} };

// A live portfolio carries each feature as a summary (`partial`): what the lists need. The rest —
// criteria, slices and their demo scripts, proofs, assumptions, task checklists, the trail, gate
// checks — comes from api/feature when a feature page or a dialog needs it, and is kept per
// repository/feature until the summary's `rev` moves (any change to it, an action's included).
// A snapshot carries every feature in full and never fetches.
const FDETAIL = {};  // "repo/slug" → { data, want: the rev it was fetched for, loading, error, failed }
const summaryOf = (rid, slug) => P.repos.find(r => r.id === rid)?.features.find(f => f.slug === slug);
function loadDetail(rid, slug) {
  const d = (FDETAIL[rid + "/" + slug] ||= {});
  if (!d.loading) {
    const want = summaryOf(rid, slug)?.rev;
    d.loading = fetch("api/feature?" + new URLSearchParams({ repo: rid, slug }), { cache: "no-cache" })
      .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(httpError(r, j)); Object.assign(d, { data: j, want, error: null }); })
      .catch(e => Object.assign(d, { error: e.message, failed: Date.now() }))
      .finally(() => { d.loading = null; });
  }
  return d.loading;
}
// The full feature when it is at hand now (undefined when it is not, or there is no such feature).
function heldFeature(rid, slug) {
  const s = summaryOf(rid, slug);
  if (!s?.partial) return s;
  const d = FDETAIL[rid + "/" + slug];
  return d?.data && d.want === s.rev ? d.data : undefined;
}
async function fullFeature(rid, slug) {
  const held = heldFeature(rid, slug);
  if (held || !summaryOf(rid, slug)) return held;
  await loadDetail(rid, slug);
  const d = FDETAIL[rid + "/" + slug];
  if (!d?.data) throw new Error(d?.error || t("Server error ({status})", { status: "?" }));
  return d.data;
}
// For a page: the full feature, or null while its first load runs — after a change the copy at hand
// shows until the new one is here. The page is redrawn when it arrives, if it still shows it.
function pageFeature(rid, slug) {
  const held = heldFeature(rid, slug);
  if (held) return held;
  const d = FDETAIL[rid + "/" + slug];
  const onIt = () => { const p = routeParts(); return p[0] === "r" && p[1] === rid && p[3] === slug; };
  if (!d?.loading && !(d?.error && Date.now() - d.failed < 5000))
    loadDetail(rid, slug).then(() => {
      if (onIt()) requestRender();
      const e = FDETAIL[rid + "/" + slug];  // a failure is tried again in 5 s while the page shows it
      if (e?.error) setTimeout(() => { if (onIt()) requestRender(); }, 5100);
    });
  return d?.data || null;
}
// Opens a "Loading…" dialog for a fetch. The check it returns says whether that dialog is still
// the one showing — the person may have closed it, or opened another, while the fetch ran.
function loadingDialog(wide = false) {
  openDialog(`<p class="muted" aria-busy="true">${esc(t("Loading…"))}</p>`, wide);
  const mark = $("#dialog").firstElementChild;
  return () => $("#dialog").classList.contains("on") && $("#dialog").firstElementChild === mark;
}
// The submit and UAT dialogs read a feature's detail (checklists, demo scripts): "Loading…" shows
// until it is here. False when it could not be loaded, or the dialog was closed meanwhile.
async function dialogFeature(a) {
  const held = heldFeature(a.repo, a.feature);
  if (held) return held;
  const still = loadingDialog();
  try {
    const f = await fullFeature(a.repo, a.feature);
    return still() ? f : false;
  } catch (e) {
    if (still()) { closeDialog(); toast(t("Could not load this feature: {msg}", { msg: e.message }), true); }
    return false;
  }
}

// A served page fetches the guide and other languages on first use (BOOT.assets: file → versioned url).
// A snapshot has them inline and no BOOT.assets, so nothing is fetched.
const ASSETS = {};
function needAsset(name) {
  const url = BOOT.assets && BOOT.assets[name];
  if (!url) return Promise.resolve();
  return ASSETS[name] || (ASSETS[name] = new Promise((ok, fail) => {
    const el = name.endsWith(".css") ? Object.assign(document.createElement("link"), { rel: "stylesheet", href: url })
      : Object.assign(document.createElement("script"), { src: url });
    el.onload = () => ok();
    el.onerror = () => { delete ASSETS[name]; el.remove(); fail(new Error(t("could not load {name}", { name }))); };
    document.head.appendChild(el);
  }));
}
// resolves once t() can speak `lang`; if the file cannot be fetched, English shows instead
const needLang = lang => lang === "en" || I18N[lang] ? Promise.resolve() : needAsset(`i18n-${lang}.js`).catch(() => {});
let guideLoading = null;
function guide() {
  if (typeof guidePage === "function") return guidePage();
  guideLoading ||= Promise.all([needAsset("guide.css"), needAsset("guide.js")]).then(() => requestRender(),
    e => { guideLoading = null; toast(t("Network error — {msg}", { msg: e.message }), true); });
  return `<div class="page"><p class="muted">${esc(t("Loading…"))}</p></div>`;
}

async function post(url, payload, retried = false) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-EGD-CSRF": BOOT.csrf }, body: JSON.stringify(payload) });
  let j = {};
  try { j = (await r.json()) || {}; } catch (e) {}  // a proxy's error page is not JSON
  if (r.status === 403 && /CSRF/.test(j.error || "") && !retried) {  // server restarted: pick up its new token once
    try { Object.assign(BOOT, await (await fetch("api/boot", { cache: "no-store" })).json()); } catch (e) {}
    return post(url, payload, true);
  }
  if (!r.ok && !j.error) j.error = httpError(r);
  return { r, j };
}

// Fixed sentences the server says (refusals, gate checks), in the reader's language. Anything else
// is shown as the server wrote it.
const SERVER_T = [
  [/^'(.+)' lacks a role allowed to (.+?) \(needs one of: (.+)\)$/, m => t("'{who}' lacks a role allowed to {what} (needs one of: {roles})", { who: m[1], what: m[2], roles: m[3] })],
  [/^'(.+)' is not in \.egd\/team\.toml$/, m => t("'{who}' is not in .egd/team.toml", { who: m[1] })],
  [/^((?:brief|design|release)\.md): '## (.+?)' is empty/, m => t("{file}: '## {section}' is empty", { file: m[1], section: m[2] })],
  [/^no acceptance criteria$/, () => t("no acceptance criteria")],
  [/^no assumptions recorded/, () => t("no assumptions recorded — every unasked question is one")],
  [/^(S-[\w.]+): no UAT verdict$/, m => t("{id}: no UAT verdict", { id: m[1] })],
  [/^(S-[\w.]+): UAT failed — (.*)$/, m => t("{id}: UAT failed — {note}", { id: m[1], note: m[2] })],
  [/^(T-[\w.-]+): (todo|doing|review|blocked)$/, m => t("{id}: {status}", { id: m[1], status: t(m[2]) })],
  [/^(A-[\w.]+): assumption still open$/, m => t("{id}: assumption still open", { id: m[1] })],
  [/^(D-[\w.]+): decision still proposed — (.*)$/, m => t("{id}: decision still proposed — {title}", { id: m[1], title: m[2] })],
  [/^the map is still the blank template/, () => t("The map is still the blank template — fill it in (the egd-scout agent can draft it), then sign.")],
  [/^spent must be a number of hours/, () => t("Hours spent must be a number between 0 and 10000")],
  [/^that folder is outside the folders this console may browse$/, () => t("That folder is outside the folders this console may browse")],
];
const trServer = s => { for (const [re, f] of SERVER_T) { const m = re.exec(s || ""); if (m) return f(m); } return s || ""; };
// who may do what in a repository (its team.toml roles): an action nobody would accept is not offered
const ACT_ROLE = { pass: "gate", close: "gate", reopen_feature: "gate", resolve: "gate", reject_assumption: "gate",
  accept: "review", reject: "review", uat: "uat", uat_pass: "uat", uat_fail: "uat", cr_approve: "cr_approve", cr_reject: "cr_approve",
  start: "work", submit: "work", solo: "work", block: "work", unblock: "work", rollback: "work", sign_map: "work" };
function canDo(a) {
  const r = P.repos.find(x => x.id === a.repo);
  if (!r || !r.team_set || !r.may) return true;
  const role = a.action === "pass" && a.target === "accept" ? "uat" : ACT_ROLE[a.action];
  return !role || (r.may[role] || []).some(n => isMe(n, a.repo));
}
const ownSubmission = (repo, slug, tid) => isMe(P.repos.find(r => r.id === repo)?.features.find(x => x.slug === slug)
  ?.tasks.find(x => x.id === tid)?.submitted_by, repo);
const refocus = el => { const a = document.activeElement; if (el && el.isConnected && !el.disabled && (!a || a === document.body)) el.focus(); };

// One request per action at a time: a second click, or a button redrawn by a poll, cannot send it again.
const ACTING = new Set();
const actKey = a => [a.repo, a.feature, a.action, a.target].join("\u0001");
async function act(payload, btn) {
  if (P.readonly) { toast(t("This console is read-only."), true); return false; }
  const key = actKey(payload);
  if (ACTING.has(key)) return false;
  ACTING.add(key);
  if (btn) { if (document.activeElement === btn) UI.held = btn; btn.disabled = true; }  // disabling blurs it: the redraw finds it by UI.held
  try {
    const { r, j } = await post("api/action", payload);
    if (!r.ok) { toast(trServer(j.error) || t("Refused"), true, (j.problems || []).map(trServer)); return false; }
    toast(doneMsg(j)); closeDialog(); await afterChange(); return true;
  } catch (e) { toast(netErr(e), true); return false; }
  finally {
    ACTING.delete(key);
    if (btn && btn.isConnected) btn.disabled = false;
    // a redraw while it ran drew this action's buttons disabled: they are live again
    document.querySelectorAll("#main [data-act]").forEach(x => { try { if (actKey(JSON.parse(x.dataset.act)) === key) x.disabled = !!P.readonly; } catch (e) {} });
    // refused, or redrawn while it ran: focus goes back to the button, live again
    const h = UI.held, a = document.activeElement;
    if (h && usable(h) && (!a || a === document.body)) { UI.held = null; h.focus({ preventScroll: true }); }
  }
}

const NEED_LABEL = { reason: N_("Reason (shown to the submitter)"), note: N_("Note"), resolution: N_("Resolution — who confirmed it, and how"),
  rollback: N_("Rollback — the exact steps to undo this release, and whether migrations reverse"),
  outcome: N_("Why it closes"), closing: N_("Reason — why it stops; for research, what it found or where it is written"),
  "block:reason": N_("Reason — what it is waiting on"), "reopen_feature:note": N_("Why it reopens") };
const needLabel = (a, n) => { const l = NEED_LABEL[a.action + ":" + n] || NEED_LABEL[n]; return l ? t(l) : n; };
// a need with fixed answers is a choice, not free text
const NEED_CHOICES = { outcome: [["dropped", N_("Dropped — it will not ship")], ["research", N_("Research — a spike; the reason says what it found")],
  ["superseded", N_("Superseded — replaced by other work")]] };
// action labels come from the server in English; show them in the reader's language by action
const ACT_LABEL = { start: N_("Start"), submit: N_("Submit"), block: N_("Block"), unblock: N_("Unblock"), accept: N_("Accept"), reject: N_("Reject"), solo: N_("Finish solo"),
  cr_approve: N_("Approve"), cr_reject: N_("Reject"), resolve: N_("Confirm"), reject_assumption: N_("Reject"),
  uat_pass: N_("UAT pass"), uat_fail: N_("UAT fail"), uat: N_("Run UAT"), sign_map: N_("Read & sign"), rollback: N_("Write rollback"),
  close: N_("Close feature"), reopen_feature: N_("Reopen") };
const actLabel = a => a.action === "pass" && a.target ? t("Pass {gate}", { gate: a.target }) : ACT_LABEL[a.action] ? t(ACT_LABEL[a.action]) : a.label;
// what an action did, by action — the server's English `message` when it is one this page does not know
const ACT_DONE = { sign_map: N_("map signed by {by}"), pass: N_("passed {target}"), start: N_("{target} → doing (@{by})"),
  accept: N_("{target} accepted"), reject: N_("{target} sent back"), block: N_("{target} blocked"), unblock: N_("{target} unblocked"),
  submit: N_("{target} → review"), solo: N_("{target} done (no review)"), cr_approve: N_("{target} approved"), cr_reject: N_("{target} rejected"),
  uat_pass: N_("UAT {target}: pass"), uat_fail: N_("UAT {target}: fail"), resolve: N_("{target} confirmed"), reject_assumption: N_("{target} rejected"), rollback: N_("rollback written"),
  close: N_("feature closed"), reopen_feature: N_("feature reopened") };
const doneMsg = j => ACT_DONE[j.action] ? t(ACT_DONE[j.action], { target: String(j.target ?? ""), by: j.by || "" }) : j.message;

function startAction(a, btn) {
  const me = signerFor(a.repo) || t("(no name set)");
  if (a.action === "sign_map") return signMap(a);
  if (a.action === "submit" || a.action === "solo") return submitTask(a);
  if (["uat", "uat_pass", "uat_fail"].includes(a.action)) return uatDialog(a);
  if (a.action === "accept" && isMe(P.repos.find(r => r.id === a.repo)?.features.find(x => x.slug === a.feature)
    ?.tasks.find(x => x.id === a.target)?.submitted_by, a.repo)) return submitTask({ ...a, action: "solo" });
  if (!a.needs || !a.needs.length) return act(a, btn);
  openDialog(`<h3>${esc(actLabel(a))}${a.target ? ` · <span class="mono">${esc(a.target)}</span>` : ""}</h3>
    <div class="muted small">${esc(a.feature || "")}</div>
    ${a.needs.map(n => `<label for="f-${esc(n)}">${esc(needLabel(a, n))}</label>${NEED_CHOICES[n]
      ? `<select class="input" id="f-${esc(n)}">${NEED_CHOICES[n].map(([v, l]) => `<option value="${esc(v)}">${esc(t(l))}</option>`).join("")}</select>`
      : `<textarea class="input" id="f-${esc(n)}" aria-describedby="e-${esc(n)}"></textarea><div class="field-err" id="e-${esc(n)}" role="alert"></div>`}`).join("")}
    <div class="foot"><span class="why">${esc(t("Recorded on the trail, signed {who}", { who: me }))}</span>
      <button class="btn" data-close>${esc(t("Cancel"))}</button><button class="btn primary" id="go">${esc(actLabel(a))}</button></div>`);
  const go = $("#go");
  go.onclick = async () => {
    const extra = {};
    for (const n of a.needs) {
      const el = document.getElementById("f-" + n), err = document.getElementById("e-" + n);
      extra[n] = el.value.trim();
      if (err) err.textContent = "";
      el.removeAttribute("aria-invalid");
      if (!extra[n]) {   // said next to the field, which takes focus
        if (err) err.textContent = t("{field} is required", { field: needLabel(a, n) });
        el.setAttribute("aria-invalid", "true"); return el.focus();
      }
    }
    await act({ ...a, ...extra }, go);
  };
}

async function signMap(a) {
  const still = loadingDialog(true);
  let text = "", err = null;
  try {
    const r = await fetch("api/map?repo=" + encodeURIComponent(a.repo), { cache: "no-store" });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(httpError(r, j));
    text = j.text || "";
  } catch (e) { err = e.message; }
  if (!still()) return;
  if (!err && !text.trim()) err = t("The map is empty — write .egd/map.md before signing.");
  if (err) {
    openDialog(`<h3>${esc(t("Repository map — {repo}", { repo: a.repo }))}</h3>
      <div class="callout">${esc(t("Could not read the repository map: {msg}", { msg: err }))}</div>
      <div class="foot"><button class="btn" data-close>${esc(t("Close"))}</button></div>`);
    return;
  }
  const blank = /^##\s/m.test(text) && !text.replace(/<!--[\s\S]*?-->/g, "").split(/^##.*$/m).slice(1).some(s => s.trim());
  openDialog(`<h3>${esc(t("Repository map — {repo}", { repo: a.repo }))}</h3>
    <p class="muted small">${esc(t("Your signature says this map is true. Planners and agents rely on it."))}</p>
    ${blank ? `<div class="callout">${esc(t("This map is still the blank template — fill it in before signing."))}</div>` : ""}
    <pre class="map" tabindex="0" role="region" aria-label="${esc(t("Repository map — {repo}", { repo: a.repo }))}">${esc(text)}</pre>
    <label class="check"><input type="checkbox" id="read" ${blank ? "disabled" : ""}> ${esc(t("I have read it and it matches the repository"))}</label>
    <div class="foot"><button class="btn" data-close>${esc(t("Cancel"))}</button><button class="btn primary" id="go" disabled>${esc(t("Sign as {who}", { who: signerFor(a.repo) }))}</button></div>`, true);
  const go = $("#go");
  $("#read").onchange = e => { go.disabled = !e.target.checked; };
  go.onclick = async () => { if (!(await act(a, go))) go.disabled = !$("#read")?.checked; };
}

// A person is the signer when the name or one of their team aliases matches.
function isMe(name, rid) {
  const me = signerFor(rid), key = x => String(x || "").trim().toLowerCase();
  if (!name || !me) return false;
  if (key(name) === key(me)) return true;
  const m = (P.repos.find(r => r.id === rid)?.team || []).find(x => [x.name, ...(x.aliases || [])].some(n => key(n) === key(me)));
  return !!m && [m.name, ...(m.aliases || [])].some(n => key(n) === key(name));
}

// Submit a task for review, or finish it without one (solo) — the only way out when nobody else
// on the team may review. A refusal stays inside the dialog so it can be answered there: scope
// drift turns into a recorded reason instead of a dead end.
async function submitTask(a) {
  const f = await dialogFeature(a);
  if (f === false) return;
  const repo = P.repos.find(r => r.id === a.repo);
  const task = f?.tasks.find(x => x.id === a.target);
  const inReview = task?.status === "review";
  const items = inReview ? [] : task?.done_when || [];
  const others = (repo?.reviewers || []).filter(n => !isMe(n, a.repo));
  const forceSolo = a.action === "solo" || inReview || !others.length;
  openDialog(`<h3>${esc(forceSolo ? t("Finish {task} without review", { task: a.target }) : t("Submit {task} for review", { task: a.target }))}</h3>
    <div class="muted small">${esc(task?.title || "")}</div>
    ${items.length ? checklist(items, "dw", t("Done when — tick each one that is genuinely true")) : ""}
    ${inReview ? "" : `<label for="spent">${esc(t("Hours spent"))}</label><input class="input w-num" type="number" id="spent" min="0" step="0.25" placeholder="${esc(task?.estimate ?? "")}">`}
    ${forceSolo
      ? `<div class="callout">${esc(others.length ? t("You submitted it, so you cannot accept it. Finishing it yourself is recorded as a solo bypass.")
          : t("No one else on this team may review — it is finished solo, and the trail records that it skipped review."))}</div>`
      : `<label class="check"><input type="checkbox" id="solo"> ${esc(t("Finish without review (recorded as solo)"))}</label>`}
    <div id="solo-box" ${forceSolo ? "" : "hidden"}><label for="solo-reason">${esc(t("Why no review?"))}</label>
      <textarea class="input" id="solo-reason">${esc(others.length ? "" : t("Only reviewer on the team"))}</textarea></div>
    <div id="refusal"></div>
    <div class="foot"><span class="why">${esc(t("Tests run before it moves"))}</span><button class="btn" data-close>${esc(t("Cancel"))}</button>
      <button class="btn primary" id="go" ${items.length ? "disabled" : ""}></button></div>`);
  let boxes = [];
  let drift = null;  // files the server said are outside the task, once it has said so
  const solo = () => forceSolo || $("#solo")?.checked;
  const label = () => { $("#go").textContent = t(solo() ? (drift ? "Finish anyway" : "Finish") : (drift ? "Submit anyway" : "Submit")); };
  const ready = () => { $("#go").disabled = !boxes.every(x => x.checked); };
  boxes = wireChecklist("dw", ready);
  if ($("#solo")) $("#solo").onchange = () => { $("#solo-box").hidden = !solo(); label(); };
  label();
  $("#go").onclick = async () => {
    if (P.readonly) return toast(t("This console is read-only."), true);
    const body = { repo: a.repo, feature: a.feature, target: a.target, action: solo() ? "solo" : "submit",
      confirm: true, spent: $("#spent")?.value || "" };
    if (solo()) { body.note = $("#solo-reason").value.trim(); if (!body.note) return $("#solo-reason").focus(); }
    if (drift) { body.drift_reason = $("#drift-reason").value.trim(); if (!body.drift_reason) return $("#drift-reason").focus(); }
    $("#go").disabled = true;
    try {
      const { r, j } = await post("api/action", body);
      if (r.ok) { toast(doneMsg(j)); closeDialog(); await afterChange(); return; }
      if (j.code === "drift") {
        drift = j.files;
        $("#refusal").innerHTML = `<div class="callout"><b>${esc(t("Changed files outside this task's declared scope"))}</b>
          <ul>${drift.map(x => `<li class="mono">${esc(x)}</li>`).join("")}</ul>
          <div class="muted small mt-6">${esc(t("Re-plan the task if they are part of it. Otherwise say why they can go along — the reason is recorded."))}</div></div>
          <label for="drift-reason">${esc(t("Why these files are fine"))}</label><textarea class="input" id="drift-reason"></textarea>`;
        $("#drift-reason").focus();
      } else showRefusal(j);
      label();
    } catch (e) { toast(netErr(e), true); }
    ready(); refocus($("#go"));
  };
}

// A checklist, named by its legend, with a "Select all" row on top when there is more than one item.
function checklist(items, attr, legend) {
  if (!items.length) return "";
  return `<fieldset class="checks"><legend>${esc(legend)}</legend>`
    + (items.length > 1 ? `<label class="check all"><input type="checkbox" data-all="${attr}"> ${esc(t("Select all"))}</label>` : "")
    + items.map(d => `<label class="check"><input type="checkbox" data-${attr}> <span>${inlineMd(d)}</span></label>`).join("") + `</fieldset>`;
}
function wireChecklist(attr, onChange) {
  const boxes = [...document.querySelectorAll(`[data-${attr}]`)], all = document.querySelector(`[data-all="${attr}"]`);
  const sync = () => {
    const n = boxes.filter(b => b.checked).length;
    if (all) { all.checked = n === boxes.length; all.indeterminate = n > 0 && n < boxes.length; }
    onChange();
  };
  boxes.forEach(b => b.onchange = sync);
  if (all) all.onchange = () => { boxes.forEach(b => b.checked = all.checked); sync(); };
  return boxes;
}

// Demo script → steps. A numbered or bulleted line starts a step; the lines under it continue it.
function demoSteps(text) {
  const mark = /^(\d+[.)]|[-*])\s+/, lines = (text || "").split("\n").map(x => x.trim()).filter(Boolean);
  if (!lines.some(l => mark.test(l))) return lines;
  const out = [];
  for (const l of lines) { if (mark.test(l) || !out.length) out.push(l.replace(mark, "")); else out[out.length - 1] += " " + l; }
  return out;
}

// A demo script as a numbered list of steps, inline markdown kept.
function demoHtml(text) {
  const steps = demoSteps(text);
  return /^\s*(\d+[.)]|[-*])\s+/m.test(text || "") ? `<ol class="steps-md">${steps.map(x => `<li>${inlineMd(x)}</li>`).join("")}</ol>`
    : steps.map(x => `<p class="steps-md">${inlineMd(x)}</p>`).join("");
}

function showRefusal(j) {
  const box = $("#refusal");
  box.innerHTML = `<div class="callout"><b>${esc(trServer(j.error) || t("Refused"))}</b>${(j.problems || []).length
    ? `<ul>${j.problems.map(x => `<li>${esc(trServer(x))}</li>`).join("")}</ul>` : ""}</div>`;
  box.setAttribute("role", "alert"); box.tabIndex = -1; box.focus();   // said aloud, and focus is not lost
}

// UAT: the client (or the PO for them) walks a slice's demo script on the running app and gives a
// verdict. The script is a checklist here, so "pass" means every step was seen working.
async function uatDialog(a) {
  const f = await dialogFeature(a);
  if (f === false) return;
  const s = f?.slices.find(x => x.id === a.target);
  const steps = demoSteps(s?.demo);
  openDialog(`<h3>${esc(t("UAT"))} · <span class="mono">${esc(a.target)}</span></h3><div class="muted small">${esc(s?.title || "")}</div>
    <p class="muted small">${esc(t("Walk the demo script on the running app with the client (or as the PO). Tick each step you saw work."))}</p>
    ${steps.length ? checklist(steps, "step", t("Demo script"))
      : `<div class="callout">${esc(t("No demo script — say in the note what was shown."))}</div>`}
    <label for="uat-note">${esc(t("Note — who walked it, where, and what was seen"))}</label><textarea class="input" id="uat-note"></textarea>
    <div id="refusal"></div>
    <div class="foot"><span class="why">${esc(t("Recorded on the trail, signed {who}", { who: signerFor(a.repo) }))}</span>
      <button class="btn" data-close>${esc(t("Cancel"))}</button><button class="btn danger" id="fail">${esc(t("UAT fail"))}</button>
      <button class="btn primary" id="pass" disabled>${esc(t("UAT pass"))}</button></div>`);
  const note = () => $("#uat-note").value.trim();
  const ready = () => { $("#pass").disabled = steps.length ? !boxes.every(b => b.checked) : !note(); };
  const boxes = wireChecklist("step", ready); $("#uat-note").oninput = ready; ready();
  const send = async passed => {
    if (P.readonly) return toast(t("This console is read-only."), true);
    if (!passed && !note()) { showRefusal({ error: t("A failed UAT needs a note saying what was wrong") }); return $("#uat-note").focus(); }
    const pass = $("#pass"), fail = $("#fail");
    pass.disabled = fail.disabled = true;
    try {
      const { r, j } = await post("api/action", { repo: a.repo, feature: a.feature, target: a.target,
        action: passed ? "uat_pass" : "uat_fail", note: note() });
      if (r.ok) { toast(doneMsg(j)); closeDialog(); await afterChange(); return; }
      showRefusal(j);
    } catch (e) { toast(netErr(e), true); }
    if (fail.isConnected) { fail.disabled = false; ready(); refocus(passed ? pass : fail); refocus(fail); }
  };
  $("#pass").onclick = () => send(true); $("#fail").onclick = () => send(false);
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeDialog();
  const b = e.target.closest("[data-act]");
  if (b) { e.preventDefault(); if (!b.disabled) startAction(JSON.parse(b.dataset.act), b); return; }
  const tr = e.target.closest("[data-transcript]");
  if (tr) return openTranscript(tr.dataset.repo, tr.dataset.slug, tr.dataset.transcript);
  const shot = e.target.closest("[data-full]");
  if (shot) return openDialog(`<h3 class="sr">${esc(shot.dataset.name || t("Screenshot"))}</h3><div class="foot mt-0"><button class="btn" data-close>${esc(t("Close"))}</button></div><img class="lightbox" src="${esc(shot.dataset.full)}" alt="${esc(shot.dataset.name || "")}">`, true);
  const colT = e.target.closest("[data-colt]");
  if (colT) { const k = colT.dataset.colt, c = store.get("boardCollapsed", ["closed"]);
    store.set("boardCollapsed", c.includes(k) ? c.filter(x => x !== k) : [...c, k]); return render(); }
  const more = e.target.closest("[data-more]");
  if (more) {   // focus goes to the first card it revealed
    const k = more.dataset.more, was = BOARD_MORE.n[k] || BOARD_PAGE; BOARD_MORE.n[k] = was + BOARD_STEP; render();
    const c = document.querySelectorAll(`[data-list="col:${k}"] [data-item]`)[was];
    return void [...(c ? c.querySelectorAll(FOCUSABLE) : [])].find(usable)?.focus();
  }
  const retry = e.target.closest("[data-retry]");
  if (retry) { retryFailed(); return render(); }
  const tab = e.target.closest("[data-tab]");

});

const repoChip = rid => `<span class="chip">${esc(rid)}</span>`;
let BYID = {};
const repoById = rid => { if (BYID.p !== P) BYID = { p: P, m: new Map(P.repos.map(r => [r.id, r])) }; return BYID.m.get(rid); };
const signerFor = rid => repoById(rid)?.signer || P.user || "";
const repoRO = rid => P.readonly || !!repoById(rid)?.readonly;
// An action button keeps focus across redraws (data-focus) and says what it acts on: "Accept T-1.1 · checkout".
const actBtn = (a, ctx, cls = "") => {
  if (repoRO(ctx.repo)) return "";
  if (a.action === "accept" && ownSubmission(ctx.repo, ctx.slug, a.target)) a = { ...a, action: "solo", label: "Finish solo" };
  if (!canDo({ ...a, repo: ctx.repo })) return `<span class="muted small" title="${esc(t("Your name in this repository has no role for this — see team.toml"))}">${esc(actLabel(a))} · ${esc(t("not your role"))}</span>`;
  const payload = { repo: ctx.repo, feature: ctx.slug, action: a.action, target: a.target, label: a.label, needs: a.needs || [] };
  const label = actLabel(a), name = label + (a.target && !label.includes(a.target) ? " " + a.target : "") + (ctx.slug ? " · " + ctx.slug : "");
  return `<button class="btn ${a.primary ? "primary" : ""} ${cls}" data-act="${esc(JSON.stringify(payload))}" data-focus="${esc(["act:" + ctx.repo, ctx.slug, a.action, a.target].join("/"))}"
    ${name !== label ? `aria-label="${esc(name)}"` : ""} ${P.readonly || ACTING.has(actKey(payload)) ? "disabled" : ""}>${esc(label)}</button>`;
};

function taskActions(task, repo, slug, small = true) {
  if (repoRO(repo)) return "";
  // the submitter cannot accept their own work; offer the recorded way out instead
  const accept = isMe(task.submitted_by, repo) ? { action: "solo", label: "Finish solo", primary: true } : { action: "accept", label: "Accept", primary: true };
  const A = {
    ready: [{ action: "start", label: "Start", primary: true }],
    doing: [{ action: "submit", label: "Submit", primary: true }, { action: "block", label: "Block", needs: ["reason"] }],
    review: [accept, { action: "reject", label: "Reject", needs: ["reason"] }],
    blocked: [{ action: "unblock", label: "Unblock" }],
  }[task.col] || [];
  return A.map(a => actBtn({ ...a, target: task.id }, { repo, slug }, small ? "sm" : "")).join(" ");
}

// ---------------------------------------------------------------- views
const KIND = {   // inbox group titles, in display order (the server says which section each item is in)
  review: N_("Waiting for review"), gate: N_("Gates ready to pass"), cr: N_("Change requests awaiting the client"),
  uat: N_("UAT verdicts due"), assumption: N_("Blocking assumptions"), map: N_("Unsigned repository maps"),
  blocked: N_("Blocked tasks"), proof: N_("Failing evidence"), defect: N_("Serious defects"),
  uncommitted: N_("Trail not committed"), lint: N_("Plan problems"), rollback: N_("Rollbacks to write"),
};
const SEV = [["decide", N_("Decide"), N_("Only a person can do these")], ["unblock", N_("Unblock"), N_("Work is stuck until these move")],
  ["hygiene", N_("Hygiene"), N_("Keeps the team's view honest")], ["all", N_("Everything"), ""]];

// The server builds inbox titles in English; rebuild them here from kind + target so they follow
// the reader's language. Anything unrecognised keeps the server's text.
function inboxTitle(i) {
  const tg = i.target, m = re => re.exec(i.title || "");
  let x;
  switch (i.kind) {
    case "review": if (tg) return t("{target} waiting for review", { target: tg }); break;
    case "gate": if (tg) return t("Ready to pass {gate}", { gate: tg }); break;
    case "cr": if (tg) return t("{target} awaiting the client", { target: tg }); break;
    case "uat": if (tg) return t("{target} needs a UAT verdict", { target: tg }); break;
    case "assumption": if (tg) return t("{target} is blocking and unanswered", { target: tg }); break;
    case "blocked": if (tg) return t("{target} blocked", { target: tg }); break;
    case "map": return t("Repository map is unsigned");
    case "rollback": return t("How is this undone? Rollback not written");
    case "lint": return t("Plan has problems");
    case "proof": if ((x = m(/^(\S+) failing$/))) return t("{target} failing", { target: x[1] }); break;
    case "defect": if ((x = m(/^(\S+) (\S+) defect open$/))) return t("{target} {severity} defect open", { target: x[1], severity: t(x[2]) }); break;
    case "uncommitted": if ((x = m(/^(\d+) /))) return t("{n} trail/plan change(s) not committed", { n: x[1] }); break;
  }
  return i.title;
}
// fixed server sentences (not data) that the inbox may show as detail or hint
const INBOX_FIXED = [N_("A person has to read .egd/map.md and confirm it is true before `frame` opens."),
  N_("Teammates cannot see these until they are committed and pushed."), N_("Being wrong here forces rework."), N_("The client walks the demo script."),
  N_("write brief.md (problem, outcome, success signal, out of scope) and get .egd/map.md reviewed"),
  N_("fill [[assumption]] and [[ac]] in plan.toml; resolve every blocking assumption"), N_("write design.md and settle every [[decision]]"),
  N_("cut [[slice]] and [[task]] entries; `egd graph` until clean"), N_("work the ready tasks (`egd ready`); run `egd proof run` before passing"),
  N_("client walks each slice's demo and records `egd uat <slice> --pass`"), N_("review it in ai-dlc (read-only here)"), N_("write release.md (rollback); close assumptions and serious defects"),
  N_("Write it now, while the change is fresh: revert what, migrations, flags, data."), N_("release needs it — release.md → ## Rollback")];
const inboxText = s => (s && INBOX_FIXED.includes(s) ? t(s) : s);
function inboxDetail(i) {
  const x = i.kind === "review" && /^(.*) — submitted by (.*)$/.exec(i.detail || "");
  return x ? t("{title} — submitted by {who}", { title: x[1], who: x[2] }) : inboxText(i.detail);
}

// Items from read-only repositories (planned in another tool) cannot be acted on here: they sit in
// their own collapsed section, and neither the tab counts nor the sidebar badge count them.
// Each group is a list (data-list) of items: when an action takes an item away, focus moves to the
// one now in its place, or to the group's heading.
function inboxGroups(items, where = "inbox") {
  const groups = {};
  items.forEach(i => (groups[i.kind] ||= []).push(i));
  const order = Object.keys(KIND).filter(k => groups[k]).concat(Object.keys(groups).filter(k => !KIND[k]));
  return order.map(k => `<section class="panel group" data-list="${esc(where + ":" + k)}"><h2 class="gh" data-head>${esc(KIND[k] ? t(KIND[k]) : k)} <span class="count">${groups[k].length}</span></h2>
      ${groups[k].map(i => { const d = inboxDetail(i), h = inboxText(i.hint); return `<div class="row item-row" data-item><div class="minw0">
          <div class="meta">${repoChip(i.repo)}${i.slug ? flink(i.repo, i.slug, i.slug) : ""}</div>
          <div class="t">${inlineMd(inboxTitle(i))}</div>${d ? `<div class="d" title="${esc(d)}">${inlineMd(d)}</div>` : ""}
          ${h ? `<div class="h" title="${esc(h)}">→ ${esc(h)}</div>` : ""}</div>
        <div class="acts">${i.actions.map(a => actBtn(a, i)).join("")}${i.slug ? `<a class="btn" href="${fhref(i.repo, i.slug)}" data-focus="${esc(["open:" + i.kind, i.repo, i.slug, i.target || ""].join("/"))}" aria-label="${esc(t("Open") + " " + i.slug)}">${esc(t("Open"))}</a>` : ""}</div></div>`; }).join("")}
      </section>`).join("");
}
function inbox() {
  const { actionable: items, elsewhere } = memo();
  const tab = SEV.some(([k]) => k === store.get("inboxTab", "decide")) ? store.get("inboxTab", "decide") : "decide";
  const of = list => tab === "all" ? list : list.filter(i => i.severity === tab);
  const shown = of(items), away = of(elsewhere);
  const openAway = store.get("inbox:elsewhere", false);
  return `<div class="page"><p class="lead">${esc(t("Nothing here moves on its own — each item needs a decision or a fix from a person."))}</p>
    <div class="tabs scroll-x" role="tablist" aria-label="${esc(t("Inbox sections"))}" data-cue>${SEV.map(([k, l, h]) => { const n = k === "all" ? items.length : items.filter(i => i.severity === k).length;
      return `<button type="button" role="tab" id="itab-${k}" data-tab="${k}" aria-selected="${k === tab}" aria-controls="inbox-panel" tabindex="${k === tab ? 0 : -1}" class="${k === tab ? "on" : ""}"${h ? ` title="${esc(t(h))}"` : ""}>${esc(t(l))} <span class="count ${n && k === "decide" ? "hot" : ""}">${n}</span></button>`; }).join("")}</div>
    <div role="tabpanel" id="inbox-panel" aria-labelledby="itab-${tab}">
    ${inboxGroups(shown) || `<div class="panel empty">${esc(tab === "decide" ? t("Nothing is waiting for a decision.") + " 🎉" : t("Nothing here."))}</div>`}
    ${away.length ? `<details class="raw" data-keep="inbox:elsewhere" ${openAway ? "open" : ""}><summary>${esc(t("Elsewhere (read-only)"))} <span class="count">${away.length}</span>
        <span class="muted small">— ${esc(t("planned in another tool; act on these there"))}</span></summary><div class="mt-6">${inboxGroups(away, "away")}</div></details>` : ""}
    </div></div>`;
}

// Tasks in read-only repositories (planned in another tool) cannot be started here: they are left
// out — of the list and of the sidebar count alike — and a line says how many.
function pickable() {
  const { pickable: rows, pickAway } = memo();
  return `<div class="page"><p class="lead">${esc(t("Ready tasks across every repository — dependencies done, nobody on them."))}</p>
    ${UI.table("pickable", { rows, placeholder: t("Find a task…"),
      search: x => [x.id, x.title, x.slice, x.f.title, x.f.slug, x.f.repo].join(" "),
      columns: [
        ...(scopeId() ? [] : [{ key: "repo", label: t("Repository"), sortValue: x => x.f.repo, render: x => repoChip(x.f.repo) }]),  // one repository in scope: no need to say it on every row
        { key: "feature", label: t("Feature"), sortValue: x => x.f.title, render: x => flink(x.f.repo, x.f.slug, x.f.title) },
        { key: "id", label: t("Task"), cls: "mono", sortValue: x => x.id, render: x => esc(x.id) },
        { key: "title", label: t("Title"), sortValue: x => x.title, render: x => inlineMd(x.title) },
        { key: "slice", label: t("Slice"), cls: "mono muted", sortValue: x => x.slice, render: x => esc(x.slice) },
        { key: "est", label: t("Est."), num: true, sortValue: x => x.estimate, render: x => esc(x.estimate) + "h" },
        { key: "acts", label: "", cls: "ta-r", render: x => taskActions(x, x.f.repo, x.f.slug) },
      ], empty: `${esc(t("Nothing ready to pick up."))} <a class="flink" href="#/board">${esc(t("See what is in progress or blocked on the board"))}</a>` })}
    ${pickAway ? `<p class="muted small">${esc(t("{n} more ready in read-only repositories — pick them up in the tool that plans them.", { n: pickAway }))}</p>` : ""}</div>`;
}

// ---------------------------------------------------------------- people
// One person, however the trail spells them: names merge case-insensitively and through each EGD
// repository's team (name, aliases, GitHub login); an agent's variants — "Claude (via X)",
// "Claude · implement (Opus 5)" — are one "Claude". The variants show on hover.
let PEOPLE = {};
function personOf(raw) {
  if (PEOPLE.p !== P) {
    const canon = new Map();
    // EGD repositories' teams — a dashboard's own repository is read-only but its team.toml counts
    for (const r of P.repos) if ((r.source || "egd") === "egd") for (const m of r.team || []) {
      const names = [m.name, ...(m.aliases || [])].filter(Boolean).map(String);
      const c = names.map(n => canon.get(n.trim().toLowerCase())).find(Boolean) || m.name;
      names.forEach(n => { const k = n.trim().toLowerCase(); if (!canon.has(k)) canon.set(k, c); });
    }
    PEOPLE = { p: P, canon, seen: new Map(), variants: new Map() };
  }
  if (!raw) return "";
  let x = PEOPLE.seen.get(raw);
  if (x == null) {
    const base = String(raw).replace(/\s*\(via [^)]*\)\s*$/i, "").split(" · ")[0].replace(/\s*\([^)]*\)\s*$/, "").trim() || String(raw).trim();
    const k = base.toLowerCase();
    x = PEOPLE.canon.get(String(raw).trim().toLowerCase()) || PEOPLE.canon.get(k);
    if (!x) { x = base; PEOPLE.canon.set(k, base); }  // the first spelling seen names the person
    PEOPLE.seen.set(raw, x);
    if (raw !== x) { const v = PEOPLE.variants.get(x) || new Set(); v.add(raw); PEOPLE.variants.set(x, v); }
  }
  return x;
}
const personVariants = p => [...(PEOPLE.variants.get(p) || [])].sort();

// ---------------------------------------------------------------- board
// A board can hold thousands of tasks: each column shows its first BOARD_PAGE cards (Done: the
// newest), and "Show N more" adds BOARD_STEP per column — for this visit, until the scope, the
// person or the search changes.
const BOARD_PAGE = 30, BOARD_STEP = 100;
let BOARD_MORE = { key: null, n: {} };
const COLS = [["ready", N_("Backlog")], ["doing", N_("Doing")], ["review", N_("Review")], ["blocked", N_("Blocked")], ["done", N_("Done")],
  ["closed", N_("Closed")]];
const ACTIVE = ["doing", "review", "blocked"];
let BOARD = {};
function boardData() {
  const all = allTasks();
  if (BOARD.all === all) return BOARD;
  const people = new Map(), doneAt = new Map();
  for (const x of all) {
    const p = personOf(x.owner);
    if (p) people.set(p, (people.get(p) || 0) + (ACTIVE.includes(x.col) ? 1 : 0));
  }
  for (const f of allFeatures()) for (const e of f.trail || [])
    if (e.type === "task_accepted" || e.type === "task_done_solo") doneAt.set(f.repo + "/" + f.slug + "/" + e.target, e.at || "");
  // Done, newest first: when the trail at hand says it was finished, else by the feature's last activity
  const key = x => doneAt.get(x.f.repo + "/" + x.f.slug + "/" + x.id) || "";
  const done = all.map((x, i) => [x, key(x), x.f.last_activity || "", i]).filter(r => r[0].col === "done")
    .sort((a, b) => (a[1] < b[1] ? 1 : a[1] > b[1] ? -1 : 0) || (a[2] < b[2] ? 1 : a[2] > b[2] ? -1 : 0) || b[3] - a[3]).map(r => r[0]);
  BOARD = { all, people: [...people].sort((a, b) => a[0].localeCompare(b[0])), done, closed: memo().closedTasks };
  return BOARD;
}
function card(c) {
  const acts = c.col === "closed" ? "" : taskActions(c, c.f.repo, c.f.slug), owner = personOf(c.owner);
  const who = c.agent && c.col !== "done" && c.col !== "closed"
    ? `<span class="muted small" title="${esc(t("Suggested for an agent: {why}", { why: (c.model_why || "").startsWith("risky: ") ? t("risky: {what}", { what: c.model_why.slice(7) }) : t(c.model_why || "") }))}">${esc(c.agent === "person" ? t("person") : c.agent + " · " + c.model)}</span>` : "";
  return `<div class="card ${c.col}" data-item><div class="meta">${repoChip(c.f.repo)}<span class="mono small">${esc(c.id)}</span>${c.col === "todo" ? `<span class="muted small">${esc(t("waiting on deps"))}</span>` : ""}${who}</div>
    <div class="ti">${inlineMd(c.title)}</div>
    <div class="mt">${flink(c.f.repo, c.f.slug, c.f.title)} · ${esc(c.estimate)}h${owner ? ` · <span title="${esc(c.owner)}">@${esc(owner)}</span>` : ""}</div>
    ${c.reason ? `<div class="mt text-bad">${esc(c.reason)}</div>` : ""}
    ${acts ? `<div class="acts start">${acts}</div>` : ""}</div>`;
}
function board() {
  const B = boardData();
  const opts = [{ value: "", label: t("Everyone") }, ...B.people.map(([p, n]) => ({ value: p, label: p, hint: t("{n} active", { n }) }))];
  let person = store.get("person", "");
  if (!opts.some(o => o.value === person)) person = "";   // stored for another scope: show everyone
  const collapsed = store.get("boardCollapsed", ["closed"]);  // Closed starts folded: history, not work
  const qRaw = store.get("board:q", ""), q = qRaw.trim().toLowerCase();
  const moreKey = [scopeId(), person, q].join("\u0001");
  if (BOARD_MORE.key !== moreKey) BOARD_MORE = { key: moreKey, n: {} };
  const more = BOARD_MORE.n;
  const keep = x => (!person || personOf(x.owner) === person) && (!q || (x.id + " " + x.title + " " + x.f.title + " " + (x.owner || "")).toLowerCase().includes(q));
  const narrowed = !!(person || q);
  const tasks = narrowed ? B.all.filter(keep) : B.all;
  const done = narrowed ? B.done.filter(keep) : B.done;
  const closed = narrowed ? B.closed.filter(keep) : B.closed;
  return `<div class="page"><div class="filters">
      ${UI.select("person", person, opts, v => { store.set("person", v); render(); }, { prefix: t("Person") })}
      <input class="input" type="search" id="boardq" data-focus="board:q" placeholder="${esc(t("Find a task…"))}" aria-label="${esc(t("Find a task…"))}" value="${esc(qRaw)}" autocomplete="off">
      <span class="muted small" aria-live="polite">${esc(t("{n} task(s)", { n: tasks.length }))}</span></div>
    ${!B.all.length && !B.closed.length ? `<p class="muted">${esc(t("No tasks yet — features get tasks at the slice gate."))}</p>` : ""}
    <div class="kanban">${COLS.map(([k, l]) => {
      const cards = k === "done" ? done : k === "closed" ? closed : tasks.filter(x => x.col === k || (k === "ready" && x.col === "todo"));
      if (collapsed.includes(k)) return `<div class="col collapsed"><button type="button" class="col-strip" data-colt="${k}" data-focus="col:${k}" aria-expanded="false"
          aria-label="${esc(t("Expand {col} ({n})", { col: t(l), n: cards.length }))}" title="${esc(t("Expand {col}", { col: t(l) }))}"><span class="cnt">${cards.length}</span><span class="vl">${esc(t(l))}</span></button></div>`;
      const limit = Math.max(BOARD_PAGE, more[k] || 0), rest = cards.length - limit;
      return `<div class="col" data-scroll="col:${k}" data-list="col:${k}" role="region" aria-label="${esc(t(l))}"><h3 data-head><span class="cl">${esc(t(l))}</span><span>${cards.length}</span>
        <button type="button" class="col-tg" data-colt="${k}" data-focus="col:${k}" aria-expanded="true" aria-label="${esc(t("Collapse {col}", { col: t(l) }))}" title="${esc(t("Collapse {col}", { col: t(l) }))}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 4L6 8l4 4"/></svg></button></h3>
        ${cards.slice(0, limit).map(card).join("") || `<div class="col-empty">${esc(t("Nothing here"))}</div>`}
        ${rest > 0 ? `<button type="button" class="btn sm" style="width:100%" data-more="${k}" data-focus="more:${k}">${esc(t("Show {n} more", { n: Math.min(rest, BOARD_STEP) }))}${rest > BOARD_STEP ? ` <span class="muted">· ${esc(t("{n} hidden", { n: rest }))}</span>` : ""}</button>` : ""}</div>`;
    }).join("")}</div></div>`;
}

const HRANK = { red: 0, amber: 1, green: 2 };
const TIER_ORDER = ["lite", "standard", "full"];
function features() {
  const rows = allFeatures().slice().sort((a, b) => HRANK[a.health] - HRANK[b.health]);  // unsorted view: riskiest first
  const tiers = [...new Set(rows.map(f => f.tier))].sort((a, b) => (TIER_ORDER.indexOf(a) + 1 || 9) - (TIER_ORDER.indexOf(b) + 1 || 9));
  const gates = [...new Set([...rows.flatMap(f => f.gates.map(g => g.name)), "released", "closed"])].filter(g => rows.some(f => f.gate === g));
  return `<div class="page">${UI.table("features", { rows, placeholder: t("Find a feature…"),
    search: f => [f.title, f.slug, f.repo].join(" "),
    filters: [
      { key: "health", label: t("Health"), options: ["red", "amber", "green"].filter(h => rows.some(f => f.health === h)).map(h => ({ value: h, label: t(HEALTH[h][1]) })), match: (f, v) => f.health === v },
      { key: "tier", label: t("Tier"), options: tiers.map(x => ({ value: x, label: x })), match: (f, v) => f.tier === v },
      { key: "gate", label: t("Gate"), options: gates.map(x => ({ value: x, label: t(x) })), match: (f, v) => f.gate === v },
    ],
    columns: [
      { key: "health", label: t("Health"), sortValue: f => HRANK[f.health], render: f => health(f.health) },
      ...(scopeId() ? [] : [{ key: "repo", label: t("Repository"), sortValue: f => f.repo, render: f => repoChip(f.repo) }]),  // one repository in scope: no need to say it on every row
      { key: "title", label: t("Feature"), cls: "wrap", sortValue: f => f.title, render: f => flink(f.repo, f.slug, f.title) },
      { key: "tier", label: t("Tier"), cls: "muted", sortValue: f => TIER_ORDER.indexOf(f.tier), render: f => esc(f.tier) },
      { key: "gate", label: t("Gate"), sortValue: f => f.gates.filter(g => g.passed).length,
        render: f => `<span class="steps">${f.gates.map(g => `<i class="${g.passed ? "done" : g.name === f.gate ? "next" : ""}" title="${esc(g.name)}"></i>`).join("")}</span> <span class="small">${esc(t(f.gate))}</span>` },
      { key: "progress", label: t("Progress"), sortValue: f => f.progress, render: f => `<span class="bar"><i style="width:${f.progress}%"></i></span> <span class="small">${f.progress}%</span>` },
      { key: "doing", label: t("Doing"), num: true, sortValue: f => f.counts.doing, render: f => f.counts.doing },
      { key: "review", label: t("Review"), num: true, sortValue: f => f.counts.review, render: f => f.counts.review },
      { key: "blocked", label: t("Blocked"), num: true, sortValue: f => f.counts.blocked, render: f => f.counts.blocked },
      { key: "crs", label: t("CRs"), num: true, sortValue: f => f.crs.filter(c => c.status === "pending").length, render: f => f.crs.filter(c => c.status === "pending").length },
      { key: "defects", label: t("Defects"), num: true, sortValue: f => f.defects.filter(d => d.status === "open").length, render: f => f.defects.filter(d => d.status === "open").length },
      { key: "activity", label: t("Last activity"), cls: "muted", sortValue: f => f.last_activity || "", render: f => ago(f.last_activity) },
    ], empty: esc(DASH ? t("No features.") : t("No features. Add a repository under Setup.")) })}</div>`;
}

const ACTIVE_CHIPS = 5;   // the Active work cell shows this many tasks, then "+N" (all of them on hover)
function people() {
  const by = {}, of = p => (by[p] ||= { tasks: [], done7: 0 });
  const weekAgo = Date.now() - 7 * 864e5;
  allFeatures().forEach(f => {
    let owner = null;   // task id → owner, built only for a feature that finished something this week
    for (const e of f.trail || []) {
      if ((e.type !== "task_accepted" && e.type !== "task_done_solo") || !(new Date(e.at).getTime() > weekAgo)) continue;
      owner ||= new Map(f.tasks.map(x => [x.id, x.owner]));
      const p = personOf(owner.get(e.target)); if (p) of(p).done7++;
    }
  });
  allTasks().forEach(x => { const p = personOf(x.owner); if (p) of(p).tasks.push(x); });
  const rows = Object.entries(by).sort((a, b) => a[0].localeCompare(b[0])).map(([p, d]) => {
    const n = { doing: 0, review: 0, blocked: 0 }, active = [];
    let spent = 0, est = 0, done = 0;
    for (const x of d.tasks) {
      if (x.col in n) { n[x.col]++; active.push(x); }
      else if (x.col === "done" && x.spent != null && x.estimate) { spent += x.spent; est += x.estimate; done++; }
    }
    return { p, done7: d.done7, ...n, ratio: done ? spent / est : null, active };
  });
  const chip = x => `<span class="nowrap">${repoChip(x.f.repo)} <span class="mono">${esc(x.id)}</span> ${st(x.col)}</span>`;
  const activeCell = r => !r.active.length ? `<span class="muted">—</span>`
    : r.active.slice(0, ACTIVE_CHIPS).map(chip).join(" &nbsp; ") + (r.active.length > ACTIVE_CHIPS
      ? ` &nbsp; <span class="chip" title="${esc(r.active.slice(ACTIVE_CHIPS).map(x => x.f.repo + " " + x.id + " · " + t(x.col)).join("\n"))}">+${r.active.length - ACTIVE_CHIPS}</span>` : "");
  return `<div class="page"><p class="lead">${esc(t("Who holds what, across every repository."))}</p>
    ${UI.table("people", { rows, placeholder: t("Find a person…"),
      search: r => [r.p, ...personVariants(r.p), ...r.active.map(x => x.id + " " + x.f.repo)].join(" "),
      columns: [
        { key: "p", label: t("Person"), sortValue: r => r.p, render: r => { const v = personVariants(r.p);
          return `<b${v.length ? ` title="${esc(t("Also signed as: {names}", { names: v.join(", ") }))}"` : ""}>${esc(r.p)}</b>${v.length ? ` <span class="muted small">+${v.length}</span>` : ""}`; } },
        { key: "doing", label: t("Doing"), num: true, sortValue: r => r.doing, render: r => r.doing },
        { key: "review", label: t("In review"), num: true, sortValue: r => r.review, render: r => r.review },
        { key: "blocked", label: t("Blocked"), num: true, sortValue: r => r.blocked, render: r => r.blocked ? `<span class="text-bad">${r.blocked}</span>` : 0 },
        { key: "done7", label: t("Done (7d)"), num: true, sortValue: r => r.done7, render: r => r.done7 },
        { key: "ratio", label: t("Actual ÷ est."), num: true, sortValue: r => r.ratio, render: r => r.ratio == null ? "—" : r.ratio.toFixed(2) + "×" },
        { key: "active", label: t("Active work"), cls: "wrap", render: activeCell },
      ], empty: `${esc(t("Nobody has picked up work yet."))} <a class="flink" href="#/pickable">${esc(t("See what is ready to pick up"))}</a>` })}</div>`;
}

const EV_LABEL = { gate_passed: N_("passed gate"), task_accepted: N_("accepted"), task_rejected: N_("rejected"), task_done_solo: N_("finished solo"),
  cr_approved: N_("approved CR"), cr_rejected: N_("rejected CR"), uat: N_("UAT"), task_started: N_("started"), task_submitted: N_("submitted"),
  task_blocked: N_("blocked"), task_unblocked: N_("unblocked"), cr_opened: N_("opened CR"), defect_opened: N_("reported"), proof_run: N_("ran proof"), feature_created: N_("created feature"),
  feature_closed: N_("closed feature"), feature_reopened: N_("reopened feature") };
const evLabel = type => EV_LABEL[type] ? t(EV_LABEL[type]) : type;
const SIG_EVENTS = ["gate_passed", "task_accepted", "task_rejected", "task_done_solo", "cr_approved", "cr_rejected", "uat",
  "feature_closed", "feature_reopened"];
// who signed an event, filterable: the options are the people found on the rows
const whoFilter = rows => ({ key: "who", label: t("Who"), match: (e, v) => personOf(e.by) === v,
  options: [...new Set(rows.map(e => personOf(e.by)).filter(Boolean))].sort().map(p => ({ value: p, label: p })) });
// A snapshot has every feature's trail. A live page fetches the signed events — every event under
// "Everything" — from api/trail, again whenever the portfolio changes.
const TRAILS = {};  // "signed" | "all" → { p: the P it was loaded for, events: Map "repo/slug" → events, loading, error }
function trailEvents(all) {
  if (!LIVE) return allFeatures().flatMap(f => f.trail.map(e => ({ ...e, f }))).sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
  const c = (TRAILS[all ? "all" : "signed"] ||= {});
  // only a success is kept for its portfolio; a failure is tried again after 5 s, 10 s, 20 s … (at most a minute)
  if (c.p !== P && !c.loading && !(c.error && Date.now() - c.failed < c.wait)) {
    const p = P, onTrail = () => routeParts()[0] === "trail";
    c.loading = fetch("api/trail" + (all ? "?all=1" : ""), { cache: "no-cache" })
      .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(httpError(r, j));
        Object.assign(c, { events: new Map(j.repos.flatMap(x => x.features.map(f => [x.id + "/" + f.slug, f.trail]))), error: null, tries: 0, p }); })
      .catch(e => { c.tries = (c.tries || 0) + 1; Object.assign(c, { error: e.message, failed: Date.now(), wait: Math.min(60000, 5000 * 2 ** (c.tries - 1)) });
        setTimeout(() => { if (onTrail()) requestRender(); }, c.wait + 100); })
      .finally(() => { c.loading = null; if (onTrail()) requestRender(); });
  }
  if (!c.events) return null;
  if (c.view?.p !== c.p || c.view.feats !== allFeatures()) {  // events by feature, built once per load and scope
    c.view = { p: c.p, feats: allFeatures(), rows: allFeatures().flatMap(f => (c.events.get(f.repo + "/" + f.slug) || []).map(e => ({ ...e, f }))).sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0)) };
  }
  return c.view.rows;
}

}

// ---------------------------------------------------------------- repository detail
// What sets one repository apart: its config.toml, team.toml and map.md, how Claude Code is wired
// in, and its features. The files come from /api/repo when this page opens.
const RTABS = [["overview", N_("Overview")], ["config", N_("Configuration")], ["team", N_("Team")], ["map", N_("Map")]];
// rid → { data } | { error, failed } | { loading }. Emptied whenever the portfolio changes or an
// action ran; an error is asked again after 5 s while the page shows it.
const RDETAIL = {};
const clearRepoDetail = () => { for (const k in RDETAIL) if (!RDETAIL[k].loading) delete RDETAIL[k]; };
async function loadRepoDetail(rid) {
  if (!LIVE || RDETAIL[rid]?.loading) return;
  const cur = (RDETAIL[rid] = { ...(RDETAIL[rid] || {}), loading: true });
  let next;
  try {
    const r = await fetch("api/repo?repo=" + encodeURIComponent(rid), { cache: "no-store" });
    const j = await r.json().catch(() => ({}));
    next = r.ok ? { data: j } : { error: httpError(r, j), failed: Date.now() };
  } catch (e) { next = { error: e.message, failed: Date.now() }; }
  if (RDETAIL[rid] === cur) RDETAIL[rid] = next; else delete RDETAIL[rid];  // cleared meanwhile: ask again on the next render
  const onIt = () => { const p = routeParts(); return p[0] === "r" && p[1] === rid && !p[3]; };
  if (onIt()) requestRender();
  if (next.error) setTimeout(() => { if (onIt()) requestRender(); }, 5100);
}

const ACTIONS = [["work", N_("Work tasks"), N_("Work")], ["review", N_("Accept / reject tasks"), N_("Review")], ["gate", N_("Pass gates"), N_("Gates")],

function repoPage(rid, tab) {
  const r = P.repos.find(x => x.id === rid);

  tab = RTABS.some(([k]) => k === tab) ? tab : "overview";
  const det = RDETAIL[rid];
  if (LIVE && (!det || (det.error && Date.now() - det.failed >= 5000))) loadRepoDetail(rid);
  const d = det?.data;
  const head = `<div class="page"><div class="fhead"><h2>${esc(r.id)}</h2>${r.readonly ? st("info", t("{source} · read-only", { source: r.source || t("other") })) : st("ok", "egd")}

  return head + body + `</div>`;
}
