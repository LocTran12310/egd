title = "Node.js / TypeScript back end"
detect = ["package.json:express", "package.json:@nestjs", "package.json:fastify", "package.json:koa", "package.json:\"hono\"", "package.json:typeorm", "package.json:prisma"]
# shared files: a commit that changes one makes every feature's evidence stale, footprint or not
watch = ["**/package.json", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/tsconfig*.json"]

conventions = """
- TypeScript strict; no `any` without a comment saying why.
- Every promise is awaited or deliberately handled — no floating promises.
- Input is validated at the edge (DTO, schema) before it reaches the service layer.
- Errors reach the client as the documented shape; stack traces never do.
"""

review = [
  "unawaited promises and unhandled rejections",
  "N+1 queries in list endpoints",
  "missing validation on new request fields",
  "raw SQL with string concatenation",
  "stack traces or internal errors returned to clients",
  "error code returned but missing from the error catalog",
  "new endpoint without a declared permission or a denied-path test",
]

[[test]]
when = ["package.json:vitest"]
command = "npx vitest run {tests}"
[[test]]
when = ["package.json:jest"]
command = "npx jest {tests}"
[[test]]
when = ["package.json:mocha"]
command = "npx mocha {tests}"

[[done_when]]
touches = ["**/migrations/**", "**/migration/**"]
items = ["the migration runs and reverts cleanly"]

[[done_when]]
touches = ["**/routes/**", "**/controllers/**", "**/controller/**", "**/handlers/**", "**/resolvers/**",
           "**/*.controller.ts", "**/*.resolver.ts"]
items = [
  "new inputs are validated and errors return the documented shape",
  "every new error code is in the error catalog (map.md → Error catalog): code, HTTP status, cause, user message key",
  "every new route declares its permission in the permission matrix (map.md → Permission matrix) and has a test for the denied case (401/403)",
]
